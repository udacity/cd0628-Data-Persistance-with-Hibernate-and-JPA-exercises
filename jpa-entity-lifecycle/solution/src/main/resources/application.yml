# Application configuration for Module 2: Entity Lifecycle + ID Strategies
# Uses H2 in-memory with Hibernate auto-DDL — no Postgres needed.

spring:
  datasource:
    url: jdbc:h2:mem:lifecycle;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE